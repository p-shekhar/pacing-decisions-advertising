[project]
name = "forecast-calibrated-causal-pacing"
version = "0.1.0"
description = "Notebook-first experiments for decision-calibrated forecasting in causal ad pacing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Prashant Shekhar" },
  { name = "Caroline Howard" },
]
dependencies = [
  "ipykernel>=6.29",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
